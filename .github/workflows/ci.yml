name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Run the quick start from the README
        run: |
          bash examples/make-demo-repo.sh "$RUNNER_TEMP/deploy-demo"
          deploy-diff-summary --repo "$RUNNER_TEMP/deploy-demo" --from v1.41.0 --to v1.42.0
